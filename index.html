<html lang="en">
  <head>
    <meta charset="utf-8">

<body>
<div id="demo"></div>
<script>
  window.onload = function() {
    window.oc = new OverChat({
        width: 300 ,
        height: 100,
        background: '0x000000',
        transparent: true,      
    })

    over_demo_panel('overChat',0.01,'overChat',
      [
        'overChat allows one to quickly add a back and forth conversation using overBubble.',
        'overChat is good for story telling between two or more people!',
        'overChat can be used for serving as a display base for a chat app.',
        'Chat bubbles are generated using overBubbles (TODO LINK).',
        'Bubbles are styled by "mood" type, such as "whisper","say", "yell" etc...',
        'New bubble types can be created as needed.',
        'Of course, all bubbles can be re-styled for your application needs.',
        'Provides a script and plugin loading framework via overBase.',
        'This demo also uses:',
        '<a href="https://github.com/RogueSignalio/overBubble">overBubble</a>.',
        '<a href="https://github.com/RogueSignalio/overGrowl">overGrowl</a>.',
        '<a href="https://github.com/RogueSignalio/overBase">overBase</a>.',
      ],
      { 
        'Test Growl-1': 'window.odemo_growler.success("I am the first growl.")', 
        'Test Growl-2': 'window.odemo_growler.info("I am the second growl.")',
        'Test Growl-3': 'window.odemo_growler.thinking("I am a different kind of growl.")',
        'Test Growl-3': 'window.odemo_growler.thinking("I am a different kind of growl.")',
      } 
    )
  }
</script>
</body>
